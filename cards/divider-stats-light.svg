<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="GitHub stats"><style>@keyframes sw{0%,100%{transform:translateX(-420px)}50%{transform:translateX(420px)}}.sw{animation:sw 10s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="cone" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#a07c46" stop-opacity="0.35"/><stop offset="1" stop-color="#a07c46" stop-opacity="0"/></radialGradient></defs><rect x="40" y="56" width="420" height="1.5" fill="#a07c46"/><rect x="740" y="56" width="420" height="1.5" fill="#a07c46"/><ellipse cx="600" cy="10" rx="170" ry="80" fill="url(#cone)" class="sw"/><text x="600" y="30" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#a07c46">ROOM 01</text><text x="600" y="66" text-anchor="middle" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif" font-size="28" font-style="italic" fill="#1f1d1a">GitHub stats</text></svg>